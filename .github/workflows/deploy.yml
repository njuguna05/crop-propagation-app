name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest tests/ -v
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "test-secret-key-for-ci"
          ENVIRONMENT: "testing"
          DEBUG: "false"

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Build frontend
        run: npm run build
        env:
          CI: false
          REACT_APP_FLORA_API_URL: "http://102.210.148.91:8080/api/v1"
          REACT_APP_MOCK_API: "false"
          REACT_APP_DEBUG: "false"

  deploy:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Build frontend on runner
        run: |
          npm ci --production=false
          npm run build
        env:
          CI: false
          REACT_APP_FLORA_API_URL: "http://102.210.148.91:8080/api/v1"
          REACT_APP_MOCK_API: "false"
          REACT_APP_DEBUG: "false"

      - name: Deploy backend to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e

            REPO_DIR="/var/www/crop-propagation-app/repo"
            STAGING="/home/humphrey_picidae/crop-propagation"

            # Pull latest code
            cd $REPO_DIR
            git fetch origin main
            git reset --hard origin/main

            # --- Backend deployment ---
            source $STAGING/backend/venv/bin/activate
            pip install -r $REPO_DIR/backend/requirements.txt --quiet

            rsync -a --delete \
              --exclude='venv' \
              --exclude='.env' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='*.db' \
              $REPO_DIR/backend/ $STAGING/backend/

            cd $STAGING/backend
            source venv/bin/activate
            alembic upgrade head

            sudo systemctl restart crop-propagation-api

      - name: Upload frontend build to server
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          rsync -az --delete \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/humphrey_picidae/crop-propagation/frontend/
          rm -f /tmp/deploy_key

      - name: Fix permissions and reload Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            chmod -R o+rX /home/humphrey_picidae/crop-propagation/frontend
            chmod o+x /home/humphrey_picidae
            sudo systemctl reload nginx
            echo "Deployment completed successfully!"
